<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Practice Spanish possessives with ten beginner sentences and immediate feedback.">
  <title>Spanish Possessives</title>
  <link rel="stylesheet" href="style.css">
  <script src="questions.js" defer></script>
  <script src="quiz.js" defer></script>
</head>
<body>
<main>
  <noscript>Please enable JavaScript to take the quiz.</noscript>
  <section id="question-area" aria-labelledby="question-title">
    <div class="question-row">
      <div class="sentence-column">
      <div class="sentence-panel"><p id="hint" class="hint"></p><h2 id="question-title" lang="es" tabindex="-1"></h2><p id="translation" lang="en" aria-live="polite" hidden></p>
      <p id="explanation" lang="en" role="status" hidden></p>
      <div id="controls">
    <button id="next" type="button" hidden>Next question →</button>
  <button id="restart" class="secondary" type="button">Shuffle &amp; restart</button>
      </div>
      </div>
      </div>
      <div id="choices" role="group" aria-labelledby="question-title" aria-describedby="hint"></div>
    </div>
  </section>
  <section id="results" hidden><h2 id="result-title" tabindex="-1">Quiz complete!</h2><p id="result-score"></p></section>
</main>
</body>
</html>
